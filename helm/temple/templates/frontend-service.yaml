apiVersion: v1
kind: Service
metadata:
  name: temple-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temple.frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "temple.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
