spring:
  application:
    name: temple-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:200ms}
      password: ${REDIS_PASSWORD:}

  datasource:
    hikari:
      pool-name: temple-hikari
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT_MS:5000}

server:
  port: 8080
  address: 0.0.0.0

app:
  version: 0.0.1-SNAPSHOT
  cache:
    enabled: ${CACHE_ENABLED:true}
    temple-id-ttl: ${CACHE_TEMPLE_ID_TTL:10m}
    public-temple-list-ttl: ${CACHE_PUBLIC_TEMPLE_LIST_TTL:60s}
    darshan-id-ttl: ${CACHE_DARSHAN_ID_TTL:5m}
    public-darshan-list-ttl: ${CACHE_PUBLIC_DARSHAN_LIST_TTL:5m}
    ritual-id-ttl: ${CACHE_RITUAL_ID_TTL:5m}
    event-id-ttl: ${CACHE_EVENT_ID_TTL:2m}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:temple-platform}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  payment:
    mock:
      webhook-secret: ${MOCK_PAYMENT_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState, db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true
