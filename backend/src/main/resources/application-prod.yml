spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD_MS:0}
  flyway:
    enabled: true
    validate-on-migrate: true
    user: ${SPRING_FLYWAY_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

logging:
  level:
    root: WARN
    com.temple.platform: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
