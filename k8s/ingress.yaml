# HTTP Ingress to the frontend Service.
# Requires a separately installed ingress-nginx controller (class nginx).
# This file does not install that controller. TLS is deferred to Module 26.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temple
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: temple-platform
spec:
  ingressClassName: nginx
  rules:
    - host: temple.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temple-frontend
                port:
                  name: http
