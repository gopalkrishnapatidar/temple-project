# Dedicated application identities. Neither workload needs Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temple-backend
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: temple-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temple-frontend
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: temple-platform
automountServiceAccountToken: false
