apiVersion: batch/v1
kind: Job
metadata:
  name: temple-validation-job
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-validation-job
    app.kubernetes.io/component: batch
    app.kubernetes.io/part-of: temple-platform
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temple-validation-job
        app.kubernetes.io/component: batch
        app.kubernetes.io/part-of: temple-platform
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      containers:
        - name: workload
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Temple Module 19 Job validation"
              echo "deterministic-output=temple-job-ok"
              exit 0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
