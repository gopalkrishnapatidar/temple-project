# NetworkPolicies for Module 21 application traffic paths.
# Backend egress to external PostgreSQL/Redis/Kafka is intentionally unrestricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temple-frontend
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: temple-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temple-platform
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temple-platform
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temple-backend
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: temple-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temple-platform
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temple-platform
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8080
