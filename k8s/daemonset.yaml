apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: temple-node-agent
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-node-agent
    app.kubernetes.io/component: node-agent
    app.kubernetes.io/part-of: temple-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: temple-node-agent
      app.kubernetes.io/component: node-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temple-node-agent
        app.kubernetes.io/component: node-agent
        app.kubernetes.io/part-of: temple-platform
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: node-agent
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
