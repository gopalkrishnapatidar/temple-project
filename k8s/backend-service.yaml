# ClusterIP Service for the existing temple-backend Deployment.
# In-namespace DNS: http://temple-backend:8080
apiVersion: v1
kind: Service
metadata:
  name: temple-backend
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: temple-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
