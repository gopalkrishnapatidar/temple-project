# Frontend Deployment for local Module 20 networking.
# Image tag matches compose.yml. Build it locally before scheduling Pods.
# GET / is the existing home route; there is no separate health endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temple-frontend
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: temple-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temple-platform
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temple-platform
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: temple-platform
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: temple-frontend:module16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_API_BASE_URL
              value: http://temple-backend:8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
