apiVersion: batch/v1
kind: CronJob
metadata:
  name: temple-validation-cronjob
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-validation-cronjob
    app.kubernetes.io/component: scheduled-batch
    app.kubernetes.io/part-of: temple-platform
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: temple-validation-cronjob
            app.kubernetes.io/component: scheduled-batch
            app.kubernetes.io/part-of: temple-platform
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 10
          containers:
            - name: workload
              image: busybox:1.36.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Temple Module 19 CronJob tick at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "deterministic-output=temple-cronjob-ok"
                  exit 0
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
