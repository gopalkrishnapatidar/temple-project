# Isolated Module 22 workload for persistent-storage and StatefulSet validation only.
# PostgreSQL, Redis, and Kafka remain outside Kubernetes in the current local architecture.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temple-stateful-storage
  namespace: temple
  labels:
    app.kubernetes.io/name: temple-platform
    app.kubernetes.io/component: stateful-storage
    app.kubernetes.io/part-of: temple-platform
spec:
  serviceName: temple-stateful-storage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temple-platform
      app.kubernetes.io/component: stateful-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temple-platform
        app.kubernetes.io/component: stateful-storage
        app.kubernetes.io/part-of: temple-platform
    spec:
      automountServiceAccountToken: false
      # fsGroup makes dynamically provisioned PVC mounts writable for the non-root process.
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: stateful-storage
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo 'Module 22 stateful storage demo' > /data/index.html
              exec python3 -m http.server 8080 --directory /data --bind 0.0.0.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Root filesystem stays read-only; /data is the writable persistent volume.
            - name: data
              mountPath: /data
  # volumeClaimTemplates creates one PVC per Pod (e.g. data-temple-stateful-storage-0).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 128Mi
